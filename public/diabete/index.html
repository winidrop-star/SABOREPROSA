<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Glicose</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glicose">
<style>
  :root{
    --bg:#f6f7f5; --card:#ffffff; --text:#1c2321; --muted:#5b6663; --line:#dfe4e2;
    --brand:#0f766e; --brand-ink:#ffffff;
    --ok:#15803d; --ok-bg:#e8f6ec;
    --warn:#a16207; --warn-bg:#fdf6d8;
    --alto:#c2410c; --alto-bg:#fdeee4;
    --bad:#b91c1c; --bad-bg:#fde8e8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111615; --card:#1b2220; --text:#eef2f0; --muted:#a3b0ac; --line:#2e3835;
      --brand:#2bb3a4; --brand-ink:#06201d;
      --ok:#4ade80; --ok-bg:#133222;
      --warn:#facc15; --warn-bg:#352d0c;
      --alto:#fb923c; --alto-bg:#3a2112;
      --bad:#f87171; --bad-bg:#3b1515;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--text); }
  body{ font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  main{ max-width:560px; margin:0 auto; padding:16px; }
  h1{ font-size:1.5rem; margin:4px 0 14px; }
  h2{ font-size:1.2rem; margin:0 0 10px; }
  h3{ font-size:1.05rem; margin:14px 0 6px; }
  p{ margin:6px 0; }
  .muted{ color:var(--muted); font-size:.92rem; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  button,.btn{
    display:block; width:100%; min-height:56px; border:0; border-radius:14px; font:inherit; font-weight:700;
    background:var(--brand); color:var(--brand-ink); cursor:pointer; padding:12px 16px; text-align:center; text-decoration:none; margin-top:10px;
  }
  button.sec,.btn.sec{ background:transparent; color:var(--brand); border:2px solid var(--brand); }
  button.escolha{ min-height:120px; font-size:1.5rem; margin-top:14px; }
  button.escolha span{ display:block; font-size:2.6rem; line-height:1.2; }
  button.sos{ background:var(--bad); color:#fff; font-size:1.15rem; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  button.mini{ display:inline-block; width:auto; min-height:0; padding:4px 10px; margin:0; font-size:.85rem; background:transparent; color:var(--muted); border:1px solid var(--line); }
  input,select,textarea{
    width:100%; font:inherit; padding:12px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--text);
  }
  input.grande{ font-size:2rem; text-align:center; font-weight:700; padding:10px; }
  label{ display:block; font-weight:600; margin:12px 0 4px; }
  .linha{ display:flex; gap:10px; }
  .linha > *{ flex:1; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip{ display:inline-block; width:auto; min-height:44px; margin:0; padding:8px 14px; border-radius:999px; font-weight:600;
    background:var(--bg); color:var(--text); border:2px solid var(--line); }
  .chip.on{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
  .aviso{ border-radius:14px; padding:14px 16px; margin-top:12px; border-left:8px solid; }
  .aviso b.big{ display:block; font-size:1.25rem; margin-bottom:4px; }
  .verde{ background:var(--ok-bg); border-color:var(--ok); }
  .amarelo{ background:var(--warn-bg); border-color:var(--warn); }
  .laranja{ background:var(--alto-bg); border-color:var(--alto); }
  .vermelho{ background:var(--bad-bg); border-color:var(--bad); }
  .valor{ font-size:2.6rem; font-weight:800; line-height:1; }
  .t-verde{ color:var(--ok); } .t-amarelo{ color:var(--warn); } .t-laranja{ color:var(--alto); } .t-vermelho{ color:var(--bad); }
  .check{ display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); font-weight:500; margin:0; cursor:pointer; }
  .check:last-child{ border-bottom:0; }
  .check input{ width:28px; height:28px; flex:none; margin:0; accent-color:var(--brand); }
  .timer{ font-size:3.2rem; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; margin:8px 0; }
  .lista{ list-style:none; padding:0; margin:0; }
  .lista li{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .lista li:last-child{ border-bottom:0; }
  .lista .num{ font-size:1.4rem; font-weight:800; min-width:64px; }
  .lista .info{ flex:1; }
  .topbar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; background:var(--card);
    border-bottom:1px solid var(--line); padding:calc(6px + env(safe-area-inset-top)) 12px 6px; }
  .topbar b{ font-size:1.1rem; }
  #menuBtn{ width:52px; min-height:48px; margin:0; padding:0; font-size:1.6rem; background:transparent; color:var(--text); }
  .lateral{ position:fixed; top:0; bottom:0; left:0; width:272px; max-width:85vw; z-index:40; background:var(--card);
    border-right:1px solid var(--line); overflow:auto; transform:translateX(-102%); transition:transform .2s ease;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)); }
  .lateral.aberta{ transform:none; box-shadow:0 0 40px rgba(0,0,0,.25); }
  .lateral .marca{ display:flex; align-items:center; gap:10px; padding:4px 8px 14px; font-weight:800; font-size:1.1rem; }
  .lateral .marca img{ width:40px; height:40px; border-radius:10px; }
  .lateral button{ display:flex; align-items:center; gap:12px; text-align:left; min-height:52px; margin:2px 0; padding:8px 12px;
    background:transparent; color:var(--text); font-weight:600; border-radius:12px; }
  .lateral button span{ font-size:1.4rem; width:30px; text-align:center; }
  .lateral button.on{ background:var(--ok-bg); color:var(--brand); }
  .lateral button.sos{ background:var(--bad); color:#fff; margin-top:14px; }
  .lateral hr{ border:0; border-top:1px solid var(--line); margin:8px 0; }
  #veu{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35; display:none; }
  #veu.on{ display:block; }
  @media (min-width:900px){
    .lateral{ transform:none; box-shadow:none; }
    #menuBtn, #veu{ display:none !important; }
    body{ padding-left:272px; }
  }
  .atalhos{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .atalhos button{ margin:0; min-height:96px; background:var(--card); color:var(--text); border:1px solid var(--line); }
  .atalhos button span{ display:block; font-size:2rem; line-height:1.2; }
  .resumo-linha{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .resumo-linha:last-child{ border-bottom:0; }
  .resumo-linha .info{ flex:1; }
  .sobre{ position:fixed; inset:0; background:var(--bg); z-index:10; overflow:auto; }
  .fecha{ position:sticky; top:0; }
  .kv p{ margin:4px 0; }
  .kv b{ display:inline-block; min-width:110px; }
  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi{ background:var(--bg); border-radius:12px; padding:12px; }
  .kpi small{ display:block; color:var(--muted); font-size:.8rem; font-weight:600; }
  .kpi b{ font-size:1.7rem; line-height:1.2; }
  .barra{ display:flex; gap:2px; height:22px; margin:12px 0 6px; }
  .barra span{ display:block; height:100%; min-width:4px; }
  .barra span:first-child{ border-radius:6px 0 0 6px; } .barra span:last-child{ border-radius:0 6px 6px 0; }
  .legenda{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.85rem; color:var(--muted); }
  .legenda i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; }
  .medalhas{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; text-align:center; }
  .medalha{ font-size:.72rem; font-weight:600; color:var(--muted); line-height:1.2; }
  .medalha span{ display:block; font-size:2rem; line-height:1.3; }
  .medalha.nao span{ filter:grayscale(1); opacity:.3; }
  .medalha.sim{ color:var(--text); }
  .estoque-linha{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .estoque-linha:last-child{ border-bottom:0; }
  .estoque-linha .info{ flex:1; }
  .estoque-linha input{ width:84px; text-align:center; font-weight:700; }
  table.rel{ width:100%; border-collapse:collapse; font-size:.85rem; }
  table.rel th, table.rel td{ text-align:left; padding:5px 4px; border-bottom:1px solid var(--line); }
  @media print{
    :root{ --bg:#fff; --card:#fff; --text:#111; --muted:#555; --line:#ccc;
      --ok:#15803d; --ok-bg:#e8f6ec; --warn:#a16207; --warn-bg:#fdf6d8; --alto:#c2410c; --alto-bg:#fdeee4; --bad:#b91c1c; --bad-bg:#fde8e8; }
    body{ padding:0; font-size:12px; background:#fff; }
    .topbar, .lateral, #veu, #sobre, .noprint, .toast{ display:none !important; }
    body{ padding-left:0 !important; }
    .card{ break-inside:avoid; }
    .kpis{ grid-template-columns:repeat(4, 1fr); }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  .toast{ position:fixed; left:16px; right:16px; bottom:calc(24px + env(safe-area-inset-bottom)); max-width:528px; margin:0 auto; background:var(--text); color:var(--bg);
    padding:14px 16px; border-radius:12px; font-weight:600; z-index:20; text-align:center; }
</style>
</head>
<body>
<header class="topbar"><button id="menuBtn" aria-label="Abrir menu">☰</button><b id="titulo"></b></header>
<aside id="lateral" class="lateral" aria-label="Menu"></aside>
<div id="veu"></div>
<main id="app"></main>
<div id="sobre"></div>

<script>
/* =========================================================
   Minha Glicose — app simples para o dia a dia com diabetes.
   Tudo fica salvo só neste celular (localStorage).
   ========================================================= */

const CHAVE = 'minha-glicose-v1';
const PADRAO = {
  cfg: {
    nome: 'Sr. Walmison',
    horaCorrida: '06:00',
    horaDormir: '22:00',
    insulina: true,
    // Faixas (mg/dL). Os valores padrão seguem recomendações gerais;
    // devem ser confirmados/ajustados com o médico.
    hipo: 70, baixo: 90, metaMax: 180, alto: 250, muitoAlto: 300,
    esperaDepois: 20,
    validadeCaneta: 28, unidadesCaneta: 300,
    contatoNome: '', contatoTel: '',
    tipo: '', remedios: '', alergias: '', medico: '', obs: ''
  },
  glicemias: [],   // { t, v, m }  (hora, valor, momento)
  insulinas: [],   // { t, u, tipo, local }  (hora, unidades, Rápida/Lenta, local)
  corridas: [],    // { ex, inicio, fim, antes, depois, km, caminhada }
  // Estoque: quantidades guardadas. Fitas e agulhas descontam sozinhas a cada registro.
  estoque: { fitas: 0, lancetas: 0, agulhas: 0, canetaRapida: 0, canetaLenta: 0 },
  canetas: { 'Rápida': null, 'Lenta': null },   // caneta em uso: { aberta, restante }
  run: null        // corrida em andamento
};

let D = carregar();
let aba = 'inicio';
let momentoSel = null;
let tagsSel = [];
const TAGS = ['😰 Estresse', '🤒 Doente', '🍺 Álcool', '🍰 Doce', '🍽️ Comi muito'];
let insTipo = null, insLocal = null;
const LOCAIS = ['Barriga', 'Braço', 'Coxa', 'Nádega'];
// Tipos de exercício e os textos de cada um
const EX = {
  Corrida: { icone: '🏃', verbo: 'correr', neg: 'corra', fazendo: 'Correndo', fez: 'correu', salvo: 'Corrida salva',
    antes: 'Antes da corrida', depois: 'Depois da corrida', durante: 'durante a corrida', km: true,
    dica: 'Correr costuma fazer a glicose cair durante e nas horas seguintes.',
    itens: [['tenis', 'Tênis confortável e meia sem costura']],
    insulina: 'Não apliquei insulina nas pernas antes de correr' },
  Academia: { icone: '🏋️', verbo: 'treinar', neg: 'treine', fazendo: 'Treinando', fez: 'treinou', salvo: 'Treino salvo',
    antes: 'Antes da academia', depois: 'Depois da academia', durante: 'durante o treino na academia', km: false,
    dica: 'Musculação às vezes faz a glicose subir durante o treino e cair horas depois — por isso meça antes de dormir.',
    itens: [['tenis', 'Tênis fechado e meia sem costura'], ['professor', 'O professor da academia sabe que tenho diabetes']],
    insulina: 'Não apliquei insulina no músculo que vou treinar hoje' }
};
const exDe = (r) => EX[r?.ex] || EX.Corrida;
let sobre = null;          // 'ficha' | 'hipo'
let hipoAte = null;

// Junta os dados salvos com os padrões (pra versões antigas continuarem funcionando)
function normalizar(s){
  const p = JSON.parse(JSON.stringify(PADRAO));
  return { ...p, ...s, insulinas: s.insulinas || [], cfg: { ...p.cfg, ...s.cfg },
    estoque: { ...p.estoque, ...s.estoque }, canetas: { ...p.canetas, ...s.canetas } };
}
function carregar(){
  try{
    const s = JSON.parse(localStorage.getItem(CHAVE));
    if(s) return normalizar(s);
  }catch(e){}
  return JSON.parse(JSON.stringify(PADRAO));
}
function salvar(){
  try{ localStorage.setItem(CHAVE, JSON.stringify(D)); }
  catch(e){ toast('Não consegui salvar neste celular.'); }
}

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const agora = () => Date.now();
const hojeStr = (t = agora()) => new Date(t).toDateString();
const hora = (t) => new Date(t).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
const dia = (t) => {
  const d = new Date(t), h = new Date();
  const ontem = new Date(); ontem.setDate(h.getDate() - 1);
  if(d.toDateString() === h.toDateString()) return 'Hoje';
  if(d.toDateString() === ontem.toDateString()) return 'Ontem';
  return d.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' });
};
const mmss = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
};
const duracao = (ms) => { const m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; };
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function numero(id){
  const v = parseInt(($(id)?.value || '').replace(/\D/g, ''), 10);
  if(!v || v < 20 || v > 600){ toast('Digite um valor entre 20 e 600.'); return null; }
  return v;
}

/* ---------- faixas de glicose ---------- */
function cor(v){
  const c = D.cfg;
  if(v < c.hipo) return 'vermelho';
  if(v <= c.metaMax) return 'verde';
  if(v <= c.alto) return 'amarelo';
  if(v <= c.muitoAlto) return 'laranja';
  return 'vermelho';
}

// Avaliação para ANTES DA CORRIDA
function vereditoCorrida(v, e){
  const c = D.cfg;
  if(v < c.hipo) return { cor:'vermelho', tipo:'hipo', titulo:`Glicose baixa — não ${e.neg} agora`,
    texto:`Coma <b>15g de açúcar rápido</b> agora (1 colher de sopa de mel ou açúcar, ou 1 copo pequeno de suco). Espere 15 minutos e meça de novo.` };
  if(v < c.baixo) return { cor:'amarelo', tipo:'comer', titulo:`Coma algo antes de ${e.verbo}`,
    texto:`Coma <b>15 a 30g de carboidrato</b> (uma fruta, um pão ou uma torrada). Espere 15 minutos e meça de novo.` };
  if(v <= c.alto) return { cor:'verde', tipo:'ok', titulo:`Pode ${e.verbo}! Bom treino ${e.icone}`,
    texto:'Leve o açúcar rápido no bolso, por garantia.' };
  if(v <= c.muitoAlto) return { cor:'laranja', tipo:'alto', titulo:'Glicose alta',
    texto: c.insulina
      ? 'Como você usa insulina, <b>cheque as cetonas</b> antes. Se deram negativo, pode fazer um treino leve. Se deram positivo ou não tem como checar, faça só uma caminhada leve hoje e beba água.'
      : 'Hoje prefira <b>uma caminhada leve</b> em vez do exercício, e beba bastante água.' };
  return { cor:'vermelho', tipo:'naocorrer', titulo:`Hoje não ${e.neg}`,
    texto:'Glicose muito alta. Beba água e descanse. Meça de novo daqui a pouco — se não baixar, <b>fale com o médico</b>.' };
}

// Avaliação para uma medida qualquer (tela inicial)
function vereditoGeral(v){
  const k = cor(v), c = D.cfg;
  if(v < c.hipo) return { cor:k, titulo:'Glicose baixa!', texto:'Siga o plano de glicose baixa agora.' };
  if(v < c.baixo) return { cor:k, titulo:'Na meta, mas no limite de baixo', texto:'Se for fazer exercício, coma algo antes.' };
  if(v <= c.metaMax) return { cor:k, titulo:'Na meta 👍', texto:'Tudo certo.' };
  if(v <= c.alto) return { cor:k, titulo:'Um pouco acima da meta', texto:'Beba água e fique atento.' };
  if(v <= c.muitoAlto) return { cor:k, titulo:'Alta', texto:'Beba água e fique atento. Siga a orientação do seu médico.' };
  return { cor:k, titulo:'Muito alta', texto:'Beba água. Se continuar alta nas próximas medidas, fale com o médico.' };
}

/* ---------- insulina ---------- */
const ultimaInsulina = (tipo) => D.insulinas.filter((i) => !tipo || i.tipo === tipo).pop();
// Sugere o próximo local do rodízio (evita aplicar sempre no mesmo lugar).
function localSugerido(){
  const u = ultimaInsulina();
  if(!u || !LOCAIS.includes(u.local)) return LOCAIS[0];
  return LOCAIS[(LOCAIS.indexOf(u.local) + 1) % LOCAIS.length];
}
const minutosDesde = (t) => Math.round((agora() - t) / 60000);
const tempoDesde = (t) => { const m = minutosDesde(t); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; };

function registrar(v, m, tags){
  D.glicemias.push({ t: agora(), v, m, ...(tags && tags.length ? { tags } : {}) });
  if(D.estoque.fitas > 0) D.estoque.fitas--;
  salvar();
}

/* ---------- números do mês ---------- */
const DIA = 864e5;
const media = (l) => l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length) : null;
function estat(dias = 30){
  const c = D.cfg, g = D.glicemias.filter((x) => x.t > agora() - dias * DIA), vs = g.map((x) => x.v);
  const n = vs.length, pct = (f) => n ? Math.round(vs.filter(f).length / n * 100) : 0;
  const m = media(vs);
  const diasCom = new Set(g.map((x) => hojeStr(x.t))).size;
  return {
    g, n, media: m, diasCom,
    baixa: pct((v) => v < c.hipo),
    meta: pct((v) => v >= c.hipo && v <= c.metaMax),
    acima: pct((v) => v > c.metaMax && v <= c.alto),
    alta: pct((v) => v > c.alto),
    hipos: vs.filter((v) => v < c.hipo).length,
    // Hemoglobina glicada estimada (fórmula ADAG: A1c = (média + 46,7) / 28,7).
    // Só mostra com medidas suficientes, espalhadas por pelo menos 7 dias.
    a1c: n >= 20 && diasCom >= 7 ? Math.round((m + 46.7) / 28.7 * 10) / 10 : null
  };
}
// Padrões: horários ou situações em que a glicose costuma sair da meta
const PERIODOS = [['madrugada', 0, 6], ['manhã', 6, 12], ['tarde', 12, 18], ['noite', 18, 24]];
function padroes(){
  const c = D.cfg, g = D.glicemias.filter((x) => x.t > agora() - 14 * DIA), out = [];
  PERIODOS.forEach(([nome, a, b]) => {
    const l = g.filter((x) => { const h = new Date(x.t).getHours(); return h >= a && h < b; });
    const m = media(l.map((x) => x.v)), baixas = l.filter((x) => x.v < c.hipo).length;
    if(baixas >= 2) out.push({ cor: 'vermelho', txt: `Teve <b>${baixas} glicoses baixas</b> de ${nome} nas últimas 2 semanas.` });
    if(l.length >= 3 && m > c.metaMax) out.push({ cor: 'amarelo', txt: `De ${nome} sua glicose costuma ficar <b>acima da meta</b> (média ${m}).` });
  });
  TAGS.forEach((t) => {
    const l = g.filter((x) => x.tags?.includes(t)), m = media(l.map((x) => x.v));
    if(l.length >= 2 && m > c.metaMax) out.push({ cor: 'amarelo', txt: `Quando marca <b>${t}</b>, a média fica em ${m}.` });
  });
  return out;
}
// Dias seguidos com pelo menos uma medida
function sequencia(){
  const dias = new Set(D.glicemias.map((x) => hojeStr(x.t)));
  const d = new Date(); if(!dias.has(d.toDateString())) d.setDate(d.getDate() - 1);
  let n = 0; while(dias.has(d.toDateString())){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function maiorSequencia(){
  const dias = [...new Set(D.glicemias.map((x) => { const d = new Date(x.t); d.setHours(12, 0, 0, 0); return d.getTime(); }))].sort((a, b) => a - b);
  let melhor = 0, atual = 0, ant = null;
  dias.forEach((t) => { atual = ant !== null && Math.round((t - ant) / DIA) === 1 ? atual + 1 : 1; melhor = Math.max(melhor, atual); ant = t; });
  return melhor;
}
function medalhas(){
  const seq = maiorSequencia(), ex = D.corridas.length, s7 = estat(7);
  const ult = D.insulinas.slice(-8);
  const rodizio = ult.length >= 8 && ult.every((x, i) => i === 0 || x.local !== ult[i - 1].local);
  return [
    ['🩸', 'Primeira medida', D.glicemias.length >= 1],
    ['🔥', '7 dias seguidos', seq >= 7],
    ['🏆', '30 dias seguidos', seq >= 30],
    ['💯', '100 medidas', D.glicemias.length >= 100],
    ['👟', '10 exercícios', ex >= 10],
    ['🥇', '50 exercícios', ex >= 50],
    ['🎯', 'Semana 70% na meta', s7.n >= 7 && s7.meta >= 70],
    ['💉', 'Rodízio certinho', rodizio]
  ];
}

/* ---------- estoque ---------- */
// Quantos por dia ele usa (média dos últimos 14 dias)
function usoPorDia(lista){
  const l = lista.filter((x) => x.t > agora() - 14 * DIA);
  if(!l.length) return 0;
  const inicio = Math.max(Math.min(...l.map((x) => x.t)), agora() - 14 * DIA);
  return l.length / Math.max(1, (agora() - inicio) / DIA);
}
function avisosEstoque(){
  const e = D.estoque, c = D.cfg, out = [];
  const dura = (qtd, porDia) => porDia > 0 ? Math.floor(qtd / porDia) : null;
  const fd = dura(e.fitas, usoPorDia(D.glicemias));
  if(fd !== null && fd <= 7) out.push(`Fitas acabam em ~${fd} dia${fd === 1 ? '' : 's'} (${e.fitas} restantes).`);
  const ad = dura(e.agulhas, usoPorDia(D.insulinas));
  if(ad !== null && ad <= 7) out.push(`Agulhas acabam em ~${ad} dia${ad === 1 ? '' : 's'} (${e.agulhas} restantes).`);
  ['Rápida', 'Lenta'].forEach((tp) => {
    const cn = D.canetas[tp]; if(!cn) return;
    const vence = Math.ceil((cn.aberta + c.validadeCaneta * DIA - agora()) / DIA);
    if(vence <= 0) out.push(`A caneta ${tp.toLowerCase()} aberta <b>venceu</b>. Abra uma nova.`);
    else if(vence <= 3) out.push(`A caneta ${tp.toLowerCase()} aberta vence em ${vence} dia${vence === 1 ? '' : 's'}.`);
    if(cn.restante <= 30) out.push(`A caneta ${tp.toLowerCase()} está no fim (~${Math.max(0, Math.round(cn.restante))} unidades).`);
    const fechadas = tp === 'Rápida' ? e.canetaRapida : e.canetaLenta;
    if(fechadas === 0 && (vence <= 7 || cn.restante <= 100)) out.push(`Não tem caneta ${tp.toLowerCase()} de reserva. Compre mais.`);
  });
  return out;
}

async function avisar(titulo, corpo){
  try{ navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); }catch(e){}
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      const reg = await navigator.serviceWorker?.getRegistration();
      if(reg) reg.showNotification(titulo, { body: corpo, icon: 'icon-192.png', tag: 'glicose' });
      else new Notification(titulo, { body: corpo });
    }
  }catch(e){}
}

/* ---------- lembretes na agenda do celular ---------- */
function eventosLembrete(){
  const c = D.cfg;
  const menos = (hhmm, min) => {
    const [h, m] = hhmm.split(':').map(Number);
    const t = (h * 60 + m - min + 1440) % 1440;
    return `${String(Math.floor(t / 60)).padStart(2,'0')}:${String(t % 60).padStart(2,'0')}`;
  };
  return [
    { hora: menos(c.horaCorrida, 30), titulo: '🩸 Meça a glicose antes do exercício',
      desc: 'Abra o app Minha Glicose e faça o checklist. Se estiver abaixo de ' + c.baixo + ', coma algo agora.' },
    { hora: c.horaCorrida, titulo: '💪 Hora do exercício!',
      desc: 'Leve açúcar rápido, celular e água. Abra o app e toque em Exercício.' },
    { hora: c.horaDormir, titulo: '🌙 Meça a glicose antes de dormir',
      desc: 'A glicose pode cair horas depois do exercício, até de madrugada. Se estiver baixa, coma um lanche.' }
  ];
}
function baixarIcs(){
  const amanha = new Date(); amanha.setDate(amanha.getDate() + 1);
  const ymd = `${amanha.getFullYear()}${String(amanha.getMonth()+1).padStart(2,'0')}${String(amanha.getDate()).padStart(2,'0')}`;
  const fim = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); const t = (h * 60 + m + 10) % 1440;
    return `${String(Math.floor(t/60)).padStart(2,'0')}${String(t%60).padStart(2,'0')}00`; };
  const txt = (s) => s.replace(/[\\;,]/g, (x) => '\\' + x);
  const linhas = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Minha Glicose//PT-BR','CALSCALE:GREGORIAN'];
  eventosLembrete().forEach((e, i) => {
    const hms = e.hora.replace(':', '') + '00';
    linhas.push('BEGIN:VEVENT',
      `UID:minha-glicose-lembrete-${i}@minha-glicose`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'')}`,
      `DTSTART:${ymd}T${hms}`, `DTEND:${ymd}T${fim(e.hora)}`,
      'RRULE:FREQ=DAILY',
      `SUMMARY:${txt(e.titulo)}`, `DESCRIPTION:${txt(e.desc)}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${txt(e.titulo)}`,'TRIGGER:PT0M','END:VALARM',
      'END:VEVENT');
  });
  linhas.push('END:VCALENDAR');
  const blob = new Blob([linhas.join('\r\n')], { type: 'text/calendar' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'lembretes-glicose.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

      <div class="card">
        <p>Glicose: <b>${ult.antes ?? '—'}</b> antes → <b class="t-${cor(ult.depois)}">${ult.depois}</b> depois.</p>
        ${queda !== null ? `<p>${queda >= 0 ? 'Caiu' : 'Subiu'} <b>${Math.abs(queda)}</b> mg/dL.</p>` : ''}
        ${ver ? `<div class="aviso ${ver.cor}"><b class="big">${ver.titulo}</b>${ver.texto}</div>` : ''}
        ${ult.depois < c.hipo ? '<button class="sos" data-sobre="hipo">Abrir plano de glicose baixa</button>' : ''}
      </div>
      <div class="card"><h2>Agora não esqueça</h2>
        <label class="check"><input type="checkbox"> 👣 Olhei os pés: sem bolhas, cortes ou vermelhidão</label>
        <label class="check"><input type="checkbox"> 💧 Bebi água</label>
        <div class="aviso amarelo"><b>🌙 Meça a glicose antes de dormir (${esc(c.horaDormir)}).</b>
          A glicose pode cair horas depois do exercício, até de madrugada.</div>
      </div>
      <button id="fechar">Pronto</button>`;
  }
  return '';
}

function telaHistorico(){
  const c = D.cfg;
  const comAmbos = D.corridas.filter((r) => r.antes && r.depois);
  const st = estat(30);

  let html = '';
  if(st.n){
    html += `<div class="card"><h2>Últimos 30 dias</h2>
      <div class="kpis">
        <div class="kpi"><small>Tempo na meta (${c.hipo}–${c.metaMax})</small><b class="t-verde">${st.meta}%</b></div>
        <div class="kpi"><small>Média</small><b>${st.media}</b> <small style="display:inline">mg/dL</small></div>
        <div class="kpi"><small>Glicada estimada</small><b>${st.a1c !== null ? String(st.a1c).replace('.', ',') + '%' : '—'}</b></div>
        <div class="kpi"><small>Glicoses baixas</small><b class="${st.hipos ? 't-vermelho' : ''}">${st.hipos}</b></div>
      </div>
      ${barraMeta(st)}
      <p class="muted" style="margin-top:10px">${st.a1c !== null
        ? 'A glicada estimada é calculada pelas medidas do dedo. Não substitui o exame de sangue, mas mostra se está indo no caminho certo.'
        : 'A glicada estimada aparece quando tiver pelo menos 20 medidas em 7 dias diferentes.'} A meta do dia a dia (70–180) é a mais usada; confirme com o médico.</p>
    </div>`;
    const pd = padroes();
    if(pd.length) html += `<div class="card"><h2>🔎 O que o app percebeu</h2>${pd.map((x) => `<div class="aviso ${x.cor}" style="margin-top:8px">${x.txt}</div>`).join('')}
      <p class="muted" style="margin-top:10px">Vale mostrar isso ao médico.</p></div>`;
  }
  html += `<div class="card"><h2>🏅 Conquistas</h2><div class="medalhas">${medalhas().map(([i, t, ok]) => `<div class="medalha ${ok ? 'sim' : 'nao'}"><span>${i}</span>${t}</div>`).join('')}</div>
    <p class="muted" style="margin-top:10px">Maior sequência: <b>${maiorSequencia()} dias</b> seguidos anotando.</p></div>`;

  html += `<div class="card"><h2>Exercício e glicose</h2>`;
  Object.keys(EX).forEach((k) => {
    const l = comAmbos.filter((r) => (r.ex || 'Corrida') === k);
    if(!l.length) return;
    const m = Math.round(l.reduce((s, r) => s + (r.antes - r.depois), 0) / l.length);
    html += `<p>${EX[k].icone} <b>${k}:</b> em média a glicose <b>${m >= 0 ? 'cai' : 'sobe'} ${Math.abs(m)} mg/dL</b> (${l.length} vez${l.length > 1 ? 'es' : ''}).</p>`;
  });
  if(!comAmbos.length) html += `<p class="muted">Ainda não tem exercícios com a glicose de antes e de depois.</p>`;
  html += `<button data-aba="relatorio">📄 Relatório pro médico (PDF)</button></div>`;

  if(D.corridas.length){
    html += `<div class="card"><h2>Exercícios</h2><ul class="lista">` +
      D.corridas.slice(-20).reverse().map((r) => `<li>
        <span style="font-size:1.6rem">${exDe(r).icone}</span>
        <div class="info"><b>${dia(r.inicio)}</b> às ${hora(r.inicio)} · ${duracao((r.fim || r.inicio) - r.inicio)}${r.km ? ' · ' + esc(r.km) + ' km' : ''}${r.caminhada ? ' · caminhada' : ''}<br>
        <span class="muted">Glicose ${r.antes ?? '—'} → ${r.depois ?? '—'}</span></div></li>`).join('') + `</ul></div>`;
  }
  if(D.insulinas.length){
    html += `<div class="card"><h2>Insulina</h2><ul class="lista">` +
      D.insulinas.slice(-30).map((x, i, arr) => ({ x, idx: D.insulinas.length - arr.length + i })).reverse().map(({ x, idx }) => `<li>
        <span class="num">${x.u}<small style="font-size:.8rem"> un</small></span>
        <div class="info">${dia(x.t)} às ${hora(x.t)}<br><span class="muted">${esc(x.tipo)} · ${esc(x.local)}</span></div>
        <button class="mini" data-apagarins="${idx}">apagar</button></li>`).join('') + `</ul></div>`;
  }
  if(D.glicemias.length){
    html += `<div class="card"><h2>Medidas</h2><ul class="lista">` +
      D.glicemias.slice(-60).map((g, i, arr) => ({ g, idx: D.glicemias.length - arr.length + i })).reverse().map(({ g, idx }) => `<li>
        <span class="num t-${cor(g.v)}">${g.v}</span>
        <div class="info">${dia(g.t)} às ${hora(g.t)}<br><span class="muted">${esc([g.m, ...(g.tags || [])].filter(Boolean).join(' · '))}</span></div>
        <button class="mini" data-apagar="${idx}">apagar</button></li>`).join('') + `</ul></div>`;
  }
  html += `<div class="card"><h2>Cópia de segurança</h2>
    <p class="muted">Os dados ficam só neste celular. Faça uma cópia de vez em quando (ou antes de trocar de celular).</p>
    <button class="sec" id="exportar">Baixar cópia</button>
    <label for="importar">Restaurar uma cópia</label><input id="importar" type="file" accept="application/json,.json"></div>`;
  return html;
}

function telaEstoque(){
  const e = D.estoque, c = D.cfg;
  const fdia = usoPorDia(D.glicemias), adia = usoPorDia(D.insulinas);
  const dura = (q, pd) => pd > 0 ? `dura ~${Math.floor(q / pd)} dias` : 'desconta sozinho';
  const linha = (k, icone, nome, sub) => `<div class="estoque-linha"><span style="font-size:1.6rem">${icone}</span>
    <div class="info"><b>${nome}</b><br><span class="muted">${sub}</span></div>
    <input type="number" inputmode="numeric" data-estoque="${k}" value="${e[k]}"></div>`;
  const caneta = (tp) => {
    const cn = D.canetas[tp], fech = tp === 'Rápida' ? e.canetaRapida : e.canetaLenta;
    let corpo;
    if(cn){
      const vence = Math.ceil((cn.aberta + c.validadeCaneta * DIA - agora()) / DIA);
      const pc = Math.max(0, Math.min(100, cn.restante / c.unidadesCaneta * 100));
      corpo = `<p>Aberta ${dia(cn.aberta).toLowerCase()} · ${vence > 0 ? `vence em <b class="${vence <= 3 ? 't-vermelho' : ''}">${vence} dia${vence === 1 ? '' : 's'}</b>` : '<b class="t-vermelho">vencida</b>'}</p>
        <p>Restam <b>~${Math.max(0, Math.round(cn.restante))} unidades</b></p>
        <div class="barra" title="${Math.round(pc)}% da caneta"><span style="width:${pc}%;background:var(--brand)"></span><span style="flex:1;background:var(--line)"></span></div>`;
    }else corpo = `<p class="muted">Nenhuma caneta aberta registrada.</p>`;
    return `<div class="card"><h2>💉 Caneta ${tp.toLowerCase()} em uso</h2>${corpo}
      <button class="sec" data-abrircaneta="${tp}">Abri uma caneta nova${fech ? ` (tem ${fech} guardada${fech > 1 ? 's' : ''})` : ''}</button></div>`;
  };
  const av = avisosEstoque();
  return `
    ${av.length ? `<div class="aviso laranja" style="margin:0 0 14px"><b class="big">📦 Atenção</b>${av.join('<br>')}</div>` : ''}
    ${caneta('Rápida')}${caneta('Lenta')}
    <div class="card"><h2>O que tem guardado</h2>
      <p class="muted">Digite quanto tem. Fitas e agulhas <b>descontam sozinhas</b> a cada medida e aplicação.</p>
      ${linha('fitas', '🩸', 'Fitas de glicose', dura(e.fitas, fdia))}
      ${linha('agulhas', '📍', 'Agulhas da caneta', dura(e.agulhas, adia))}
      ${linha('lancetas', '👆', 'Lancetas', 'troque com frequência')}
      ${linha('canetaRapida', '💉', 'Canetas rápidas fechadas', 'guardadas na geladeira')}
      ${linha('canetaLenta', '💉', 'Canetas lentas fechadas', 'guardadas na geladeira')}
    </div>
    <div class="card"><h2>Ajustes das canetas</h2>
      <label for="c_validadeCaneta">Depois de aberta, vale quantos dias?</label>
      <input id="c_validadeCaneta" data-cfg="validadeCaneta" type="number" inputmode="numeric" value="${c.validadeCaneta}">
      <label for="c_unidadesCaneta">Quantas unidades tem uma caneta?</label>
      <input id="c_unidadesCaneta" data-cfg="unidadesCaneta" type="number" inputmode="numeric" value="${c.unidadesCaneta}">
      <p class="muted" style="margin-top:8px">Confira na bula da insulina dele. A maioria das canetas tem 300 unidades.</p>
    </div>`;
}

    `<label for="c_${k}">${rot}</label><input id="c_${k}" data-cfg="${k}" type="${tipo}" value="${esc(c[k])}" ${extra}>`;
  const area = (k, rot) => `<label for="c_${k}">${rot}</label><textarea id="c_${k}" data-cfg="${k}" rows="2">${esc(c[k])}</textarea>`;

  <div class="card"><h2>Você</h2>

  </div>

  <div class="card"><h2>Horários e lembretes</h2>
    <div class="linha"><div>${campo('horaCorrida', 'Exercício', 'time')}</div><div>${campo('horaDormir', 'Dormir', 'time')}</div></div>
    <p class="muted" style="margin-top:12px">O celular só avisa com o app fechado se os lembretes estiverem na agenda. Toque abaixo uma vez (e de novo se mudar os horários):</p>
    <button id="ics">📅 Colocar lembretes na agenda do iPhone</button>
    ${permNotif === 'default' ? '<button class="sec" id="notif">🔔 Permitir avisos do app</button>' : ''}
  </div>

  <div class="card"><h2>Contato da família</h2>
    <p class="muted">Recebe a mensagem do botão “Estou passando mal”.</p>
    ${campo('contatoNome', 'Nome')}
    ${campo('contatoTel', 'WhatsApp (com DDD)', 'tel', 'inputmode="tel" placeholder="(11) 91234-5678"')}
  </div>

  <div class="card"><h2>Faixas de glicose (mg/dL)</h2>
    <div class="aviso amarelo">⚠️ Estes números são padrões gerais. <b>Confirme com o médico</b> e ajuste aqui.</div>
    ${campo('metaMax', 'Meta do dia a dia: até', 'number', 'inputmode="numeric"')}
    <div class="linha"><div>${campo('hipo', 'Baixa (hipo) abaixo de', 'number', 'inputmode="numeric"')}</div>
      <div>${campo('baixo', 'Comer antes do exercício abaixo de', 'number', 'inputmode="numeric"')}</div></div>
    <div class="linha"><div>${campo('alto', 'Alta acima de', 'number', 'inputmode="numeric"')}</div>
      <div>${campo('muitoAlto', 'Sem exercício acima de', 'number', 'inputmode="numeric"')}</div></div>
    ${campo('esperaDepois', 'Medir quantos minutos depois do exercício', 'number', 'inputmode="numeric"')}
  </div>

  <div class="card"><h2>Ficha de emergência</h2>
    ${campo('tipo', 'Tipo de diabetes', 'text', 'placeholder="Ex.: tipo 2"')}
    ${area('remedios', 'Remédios / insulina que usa')}
    ${area('alergias', 'Alergias')}
    ${campo('medico', 'Médico e telefone')}
    ${area('obs', 'Outras informações')}
    <button class="sec" data-aba="emergencia">Ver ficha</button>
  </div>

  <p class="muted">Este app ajuda a registrar, lembrar e avisar. Ele não substitui o médico — as decisões sobre remédios e doses são sempre com ele.</p>`;
}

/* ---------- sobreposições ---------- */
function telaFicha(comoTela){
  const c = D.cfg;
  const l = (r, v) => v ? `<p><b>${r}:</b> ${esc(v)}</p>` : '';
  const ult = D.glicemias[D.glicemias.length - 1];
  return `<main style="${comoTela ? 'padding:0' : ''}">
    <div class="aviso vermelho"><b class="big">🆘 ${c.nome ? esc(c.nome) + ' — ' : ''}TENHO DIABETES</b>
      Se eu estiver confuso, suando frio ou desmaiado, posso estar com <b>glicose baixa</b>.
      Se eu conseguir engolir, me dê <b>açúcar, mel ou suco</b>. Se não, chame o <b>SAMU (192)</b>.</div>
    <div class="card kv" style="margin-top:14px">
      ${l('Tipo', c.tipo)}${l('Usa insulina', c.insulina ? 'Sim' : '')}${l('Remédios', c.remedios)}${l('Alergias', c.alergias)}
      ${l('Médico', c.medico)}${l('Contato', [c.contatoNome, c.contatoTel].filter(Boolean).join(' — '))}${l('Obs.', c.obs)}
      ${ult ? `<p><b>Última glicose:</b> ${ult.v} mg/dL (${dia(ult.t)} ${hora(ult.t)})</p>` : ''}
    </div>
    <a class="btn sos" href="tel:192" style="background:var(--bad);color:#fff">📞 Ligar para o SAMU (192)</a>
    ${c.contatoTel ? `<a class="btn sec" href="tel:${esc(c.contatoTel.replace(/[^\d+]/g, ''))}">📞 Ligar para ${esc(c.contatoNome || 'o contato')}</a>` : ''}
    ${comoTela ? '<button class="sos" data-sobre="hipo">⚠️ Estou com a glicose baixa</button>' : '<button class="sec" data-fechar>Fechar</button>'}
  </main>`;
}
function barraMeta(st){
  const c = D.cfg;
  const partes = [['Baixa', st.baixa, 'var(--bad)', `< ${c.hipo}`], ['Na meta', st.meta, 'var(--ok)', `${c.hipo}–${c.metaMax}`],
    ['Acima', st.acima, 'var(--warn)', `${c.metaMax + 1}–${c.alto}`], ['Alta', st.alta, 'var(--alto)', `> ${c.alto}`]];
  return `<div class="barra" role="img" aria-label="${partes.map(([n, v]) => `${n} ${v}%`).join(', ')}">${partes.filter(([, v]) => v > 0)
      .map(([n, v, cr, f]) => `<span style="flex:${v};background:${cr}" title="${n} (${f}): ${v}%"></span>`).join('')}</div>
    <div class="legenda">${partes.map(([n, v, cr, f]) => `<span><i style="background:${cr}"></i>${n} (${f}): <b>${v}%</b></span>`).join('')}</div>`;
}
function telaRelatorio(){
  const c = D.cfg, st = estat(30);
  const ini = new Date(agora() - 30 * DIA).toLocaleDateString('pt-BR'), fim = new Date().toLocaleDateString('pt-BR');
  const periodos = PERIODOS.map(([nome, a, b]) => {
    const l = st.g.filter((x) => { const h = new Date(x.t).getHours(); return h >= a && h < b; }).map((x) => x.v);
    return `<tr><td>${nome[0].toUpperCase() + nome.slice(1)} (${a}h–${b}h)</td><td>${l.length}</td><td>${media(l) ?? '—'}</td><td>${l.length ? Math.min(...l) : '—'}</td><td>${l.length ? Math.max(...l) : '—'}</td></tr>`;
  }).join('');
  const ins = D.insulinas.filter((x) => x.t > agora() - 30 * DIA);
  const diasIns = new Set(ins.map((x) => hojeStr(x.t))).size || 1;
  const insTxt = ['Rápida', 'Lenta'].map((tp) => { const l = ins.filter((x) => x.tipo === tp);
    return l.length ? `<p>Insulina ${tp.toLowerCase()}: média <b>${String(Math.round(l.reduce((a, x) => a + x.u, 0) / diasIns * 10) / 10).replace('.', ',')} un/dia</b> (${l.length} aplicações)</p>` : ''; }).join('');
  const exs = D.corridas.filter((x) => x.inicio > agora() - 30 * DIA);
  const exTxt = Object.keys(EX).map((k) => { const l = exs.filter((x) => (x.ex || 'Corrida') === k), ab = l.filter((x) => x.antes && x.depois);
    return l.length ? `<p>${k}: <b>${l.length}x</b>${ab.length ? ` · glicose cai em média <b>${media(ab.map((x) => x.antes - x.depois))} mg/dL</b>` : ''}</p>` : ''; }).join('');
  const pd = padroes();
  return `<div>
    <button id="imprimir" class="noprint">📄 Salvar PDF</button>
    <h1 style="margin-top:16px">Relatório de glicose</h1>
    <p><b>${esc(c.nome)}</b>${c.tipo ? ' · ' + esc(c.tipo) : ''} · ${ini} a ${fim}</p>
    ${!st.n ? '<p class="muted">Ainda não tem medidas nos últimos 30 dias.</p>' : `
    <div class="card"><div class="kpis">
      <div class="kpi"><small>Tempo na meta</small><b>${st.meta}%</b></div>
      <div class="kpi"><small>Média (mg/dL)</small><b>${st.media}</b></div>
      <div class="kpi"><small>Glicada estimada</small><b>${st.a1c !== null ? String(st.a1c).replace('.', ',') + '%' : '—'}</b></div>
      <div class="kpi"><small>Baixas (&lt; ${c.hipo})</small><b>${st.hipos}</b></div>
    </div>${barraMeta(st)}
    <p class="muted" style="margin-top:8px">${st.n} medidas de ponta de dedo em ${st.diasCom} dias. Glicada estimada pela média (fórmula ADAG); não substitui o exame de laboratório.</p></div>
    <div class="card"><h2>Por horário</h2><table class="rel"><tr><th>Período</th><th>Medidas</th><th>Média</th><th>Menor</th><th>Maior</th></tr>${periodos}</table></div>
    ${pd.length ? `<div class="card"><h2>Padrões observados (14 dias)</h2>${pd.map((x) => `<p>• ${x.txt}</p>`).join('')}</div>` : ''}`}
    ${insTxt || exTxt ? `<div class="card"><h2>Insulina e exercício</h2>${insTxt}${exTxt}</div>` : ''}
    ${st.n ? `<div class="card"><h2>Todas as medidas</h2><table class="rel"><tr><th>Data</th><th>Hora</th><th>mg/dL</th><th>Momento</th></tr>
      ${st.g.slice().reverse().map((x) => `<tr><td>${new Date(x.t).toLocaleDateString('pt-BR')}</td><td>${hora(x.t)}</td><td><b>${x.v}</b></td><td>${esc([x.m, ...(x.tags || [])].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table></div>` : ''}
    ${ins.length ? `<div class="card"><h2>Aplicações de insulina</h2><table class="rel"><tr><th>Data</th><th>Hora</th><th>Unid.</th><th>Tipo · local</th></tr>
      ${ins.slice().reverse().map((x) => `<tr><td>${new Date(x.t).toLocaleDateString('pt-BR')}</td><td>${hora(x.t)}</td><td>${x.u}</td><td>${esc(x.tipo)} · ${esc(x.local)}</td></tr>`).join('')}</table></div>` : ''}
    <div class="noprint">
      <p class="muted">No iPhone: toque em “Salvar PDF”, depois no botão de compartilhar (quadrado com a seta) e escolha “Salvar em Arquivos” ou envie direto pelo WhatsApp.</p>
      <button class="sec" id="relatorio">Enviar em texto pelo WhatsApp</button>
    </div>
  </div>`;
}
function telaHipo(){
  return `<main>
    <h1>Glicose baixa — faça agora:</h1>
    <div class="card">
      <p style="font-size:1.25rem"><b>1.</b> Coma <b>15g de açúcar rápido</b>:<br>
      1 colher de sopa de açúcar ou mel, <b>ou</b> 1 copo pequeno (150ml) de suco ou refrigerante comum (não diet).</p>
      <p style="font-size:1.25rem"><b>2.</b> Sente e espere <b>15 minutos</b>.</p>
      <p style="font-size:1.25rem"><b>3.</b> Meça de novo. Se ainda estiver abaixo de ${D.cfg.hipo}, repita.</p>
      <p style="font-size:1.25rem"><b>4.</b> Quando melhorar, faça um lanche.</p>
    </div>
    ${hipoAte ? `<div class="card" style="text-align:center"><p>Medir de novo em</p><div class="timer" data-conta="${hipoAte}">${mmss(hipoAte - agora())}</div></div>`
      : `<button id="hipoTimer">Já comi — contar 15 minutos</button>`}
    <button class="sos" id="socorro">🆘 Avisar a família no WhatsApp</button>
    <a class="btn sec" href="tel:192">📞 Ligar para o SAMU (192)</a>
    <button class="sec" data-fechar>Fechar</button>
  </main>`;
}

  ['relatorio', '📄', 'Relatório', () => telaRelatorio()],
  ['estoque', '📦', 'Estoque', () => telaEstoque()],
  ['emergencia', '🆘', 'Emergência', () => telaFicha(true)],
  ['ajustes', '⚙️', 'Ajustes', () => telaAjustes()]
];
let menuAberto = false;
function render(){
  const t = TELAS.find(([k]) => k === aba) || TELAS[0];
  $('#app').innerHTML = t[3]();
  $('#titulo').textContent = t[1] + ' ' + t[2];
  $('#lateral').innerHTML = `<div class="marca"><img src="icon-192.png" alt="">Minha Glicose</div>` +
    TELAS.map(([k, i, n], idx) => (idx === 4 || idx === 7 ? '<hr>' : '') + `<button class="${aba === k ? 'on' : ''}" data-aba="${k}"><span>${i}</span>${n}</button>`).join('') +
    `<button class="sos" data-sobre="hipo"><span>⚠️</span>Glicose baixa</button>`;
  $('#lateral').classList.toggle('aberta', menuAberto);
  $('#veu').classList.toggle('on', menuAberto);
  const sob = { ficha: () => telaFicha(false), hipo: telaHipo };
  $('#sobre').innerHTML = sobre ? `<div class="sobre">${sob[sobre]()}</div>` : '';
}

document.addEventListener('click', (e) => {
  if(e.target.id === 'veu'){ menuAberto = false; render(); return; }
  const el = e.target.closest('button, [data-aba], [data-sobre]');
  if(!el) return;
  const d = el.dataset;

  if(el.id === 'menuBtn'){ menuAberto = !menuAberto; render(); return; }
  if(d.aba){ aba = d.aba; menuAberto = false; render(); scrollTo(0, 0); return; }
  if(d.ex){ D.run = { ex: d.ex, etapa: 'antes', checks: {} }; salvar(); render(); scrollTo(0, 0); return; }
  if(d.sobre){
    if(d.sobre === 'hipo' && hipoAte && hipoAte < agora()) hipoAte = null;
    sobre = d.sobre; menuAberto = false; render(); document.querySelector('.sobre')?.scrollTo(0, 0); return;
  }
  if('fechar' in d){ sobre = null; render(); return; }
  if(d.momento || d.instipo || d.inslocal || d.tag){
    if(d.momento) momentoSel = momentoSel === d.momento ? null : d.momento;
    if(d.tag) tagsSel = tagsSel.includes(d.tag) ? tagsSel.filter((x) => x !== d.tag) : [...tagsSel, d.tag];
    if(d.instipo) insTipo = d.instipo;
    if(d.inslocal) insLocal = d.inslocal;
    const g = $('#gl')?.value, n = $('#ins')?.value;
    render(); if($('#gl')) $('#gl').value = g; if($('#ins')) $('#ins').value = n; return;
  }
  if(d.abrircaneta){
    const tp = d.abrircaneta, k = tp === 'Rápida' ? 'canetaRapida' : 'canetaLenta';
    if(!confirm(`Registrar que abriu uma caneta ${tp.toLowerCase()} nova hoje?`)) return;
    D.canetas[tp] = { aberta: agora(), restante: D.cfg.unidadesCaneta };
    if(D.estoque[k] > 0) D.estoque[k]--;
    salvar(); render(); toast('Caneta nova registrada ✓'); return;
  }
  if(d.apagarins !== undefined){
    if(confirm('Apagar esta aplicação?')){ D.insulinas.splice(+d.apagarins, 1); salvar(); render(); }
    return;
  }
  if(d.apagar !== undefined){
    if(confirm('Apagar esta medida?')){ D.glicemias.splice(+d.apagar, 1); salvar(); render(); }
    return;
  }

  switch(el.id){
    case 'salvarGl': {
      const v = numero('#gl'); if(!v) return;
      registrar(v, momentoSel || '', tagsSel);
      momentoSel = null; tagsSel = [];
      const ver = vereditoGeral(v);
      if(v < D.cfg.hipo){ sobre = 'hipo'; render(); return; }
      render();
      $('#app').insertAdjacentHTML('afterbegin', `<div class="aviso ${ver.cor}" style="margin:0 0 14px"><b class="big">${v} — ${ver.titulo}</b>${ver.texto}</div>`);
      return;
    }
    case 'salvarIns': {
      const u = parseFloat(($('#ins').value || '').replace(',', '.'));
      if(!(u > 0 && u <= 100)){ toast('Digite quantas unidades aplicou.'); return; }
      if(!insTipo){ toast('Toque em Rápida ou Lenta.'); return; }
      const local = insLocal || localSugerido();
      D.insulinas.push({ t: agora(), u, tipo: insTipo, local });
      if(D.estoque.agulhas > 0) D.estoque.agulhas--;
      if(D.canetas[insTipo]) D.canetas[insTipo].restante -= u + 2;   // +2 un do teste de fluxo (“purga”)
      salvar(); insTipo = null; insLocal = null; render();
      toast(`Anotado: ${u} un ${local.toLowerCase()} ✓`);
      return;
    }
    case 'conferir': {
      const v = numero('#glAntes'); if(!v) return;
      D.run = { ...D.run, etapa: 'antes', antes: v, cetonasOk: false, soCaminhar: false };
      registrar(v, exDe(D.run).antes);
      render(); return;
    }
    case 'esperar': case 'hipoTimer': {
      const ate = agora() + 15 * 60000;
      if(el.id === 'hipoTimer'){ hipoAte = ate; }
      else { D.run.etapa = 'esperando'; D.run.esperaAte = ate; salvar(); }
      render(); return;
    }
    case 'trocarEx': D.run = null; salvar(); render(); return;
    case 'remedir': D.run.etapa = 'antes'; D.run.antes = null; salvar(); render(); return;
    case 'medirDeNovo': D.run.antes = null; salvar(); render(); return;
    case 'comecar':
      D.run.etapa = 'correndo'; D.run.inicio = agora(); salvar(); render(); return;
    case 'cancelar': D.run = null; salvar(); aba = 'inicio'; render(); return;
    case 'terminei':
      if(!confirm('Terminou?')) return;
      D.run.etapa = 'depois'; D.run.fim = agora(); salvar(); render(); return;
    case 'salvarDepois': {
      const v = numero('#glDepois'); if(!v) return;
      const r = D.run;
      const km = parseFloat(($('#km')?.value || '').replace(',', '.'));
      D.corridas.push({ ex: r.ex, inicio: r.inicio, fim: r.fim, antes: r.antes || null, depois: v, km: km > 0 ? km : null, caminhada: !!r.soCaminhar && !r.cetonasOk });
      registrar(v, exDe(r).depois);
      D.run = { etapa: 'fim', ex: r.ex }; salvar(); render(); scrollTo(0, 0); return;
    }
    case 'fechar': D.run = null; salvar(); aba = 'inicio'; render(); return;
    case 'socorro': pedirAjuda(D.run?.etapa === 'correndo' ? 'estou passando mal ' + exDe(D.run).durante : 'estou com a glicose baixa / passando mal'); return;
    case 'ics': baixarIcs(); return;
    case 'notif': Notification.requestPermission().then(render); return;
    case 'relatorio': compartilharResumo(); return;
    case 'imprimir': window.print(); return;
    case 'exportar': exportar(); return;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if(el.dataset.check){
    D.run.checks[el.dataset.check] = el.checked; salvar(); render(); return;
  }
  if(el.id === 'cetonas'){ D.run.cetonasOk = el.checked; salvar(); render(); return; }
  if(el.id === 'caminhar'){ D.run.soCaminhar = el.checked; salvar(); render(); return; }
  if(el.dataset.cfg){
    const k = el.dataset.cfg;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if(el.type === 'number'){ v = parseInt(v, 10); if(!(v > 0)){ el.value = D.cfg[k]; return; } }
    if(el.type === 'time' && !v){ el.value = D.cfg[k]; return; }
    D.cfg[k] = v; salvar(); toast('Salvo ✓');
    if(k === 'horaCorrida' || k === 'horaDormir') toast('Salvo ✓ — coloque os lembretes na agenda de novo');
    if(el.type === 'checkbox' || el.type === 'time') render();
    return;
  }
  if(el.dataset.estoque){
    const v = parseInt(el.value, 10);
    if(!(v >= 0)){ el.value = D.estoque[el.dataset.estoque]; return; }
    D.estoque[el.dataset.estoque] = v; salvar(); toast('Salvo ✓'); render(); return;
  }
  if(el.id === 'km' && D.run){ D.run.km = el.value; salvar(); return; }
  if(el.id === 'importar' && el.files[0]) importar(el.files[0]);
});

/* ---------- resumo / cópia ---------- */
function compartilharResumo(){
  const c = D.cfg, g = D.glicemias.filter((x) => x.t > agora() - 30 * 864e5);
  const r = D.corridas.filter((x) => x.inicio > agora() - 30 * 864e5);
  let t = `Resumo de glicose — últimos 30 dias${c.nome ? ' — ' + c.nome : ''}\n`;
  if(g.length){
    const vs = g.map((x) => x.v);
    t += `Medidas: ${g.length} · média ${Math.round(vs.reduce((a, b) => a + b, 0) / vs.length)} · menor ${Math.min(...vs)} · maior ${Math.max(...vs)}\n`;
    t += `Abaixo de ${c.hipo}: ${vs.filter((v) => v < c.hipo).length}x · Acima de ${c.alto}: ${vs.filter((v) => v > c.alto).length}x\n`;
  }
  if(r.length){
    const ab = r.filter((x) => x.antes && x.depois);
    Object.keys(EX).forEach((k) => {
      const l = r.filter((x) => (x.ex || 'Corrida') === k), ab2 = l.filter((x) => x.antes && x.depois);
      if(l.length) t += `${k}: ${l.length}x` + (ab2.length ? ` · queda média ${Math.round(ab2.reduce((s, x) => s + x.antes - x.depois, 0) / ab2.length)} mg/dL` : '') + '\n';
    });
  }
  const ins = D.insulinas.filter((x) => x.t > agora() - 30 * 864e5);
  if(ins.length){
    const dias = new Set(ins.map((x) => hojeStr(x.t))).size;
    ['Rápida', 'Lenta'].forEach((tp) => {
      const l = ins.filter((x) => x.tipo === tp);
      if(l.length) t += `Insulina ${tp.toLowerCase()}: média ${Math.round(l.reduce((a, x) => a + x.u, 0) / dias * 10) / 10} un/dia (${l.length} aplicações)\n`;
    });
  }
  t += '\nMedidas:\n' + g.slice().reverse().map((x) => `${new Date(x.t).toLocaleDateString('pt-BR')} ${hora(x.t)} — ${x.v}${x.m ? ' (' + x.m + ')' : ''}`).join('\n');
  if(navigator.share) navigator.share({ title: 'Resumo de glicose', text: t }).catch(() => {});
  else navigator.clipboard?.writeText(t).then(() => toast('Resumo copiado. Cole no WhatsApp do médico.'));
}
function exportar(){
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `glicose-copia-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importar(arq){
  arq.text().then((s) => {
    const x = JSON.parse(s);
    if(!x || !Array.isArray(x.glicemias)) throw 0;
    if(!confirm('Isso substitui os dados atuais pelos da cópia. Continuar?')) return;
    D = normalizar(x); salvar(); render(); toast('Cópia restaurada ✓');
  }).catch(() => toast('Arquivo inválido.'));
}

/* ---------- relógio: atualiza cronômetros e dispara avisos ---------- */
const avisado = {};
setInterval(() => {
  document.querySelectorAll('[data-conta]').forEach((el) => {
    const ate = +el.dataset.conta, falta = ate - agora();
    el.textContent = mmss(falta);
    if(falta <= 0 && !avisado[ate]){
      avisado[ate] = true;
      avisar('⏰ Hora de medir a glicose', 'Abra o app e anote o valor.');
    }
  });
  document.querySelectorAll('[data-desde]').forEach((el) => { el.textContent = mmss(agora() - +el.dataset.desde); });
}, 1000);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if(D.run && D.run.etapa !== 'fim') aba = 'exercicio';
render();
</script>
